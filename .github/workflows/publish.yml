name: Publish to pub.dev

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dart SDK with JWT token
        uses: dart-lang/setup-dart@v1
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Write package version from git tag into pubspec.yaml
        run: |
          package_version="${VERSION#v}"

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$VERSION' must be a Dart package version, optionally prefixed with 'v'."
            exit 1
          fi

          sed -i "s/^version: .*/version: $package_version/" pubspec.yaml
        env:
          VERSION: ${{ github.ref_name }}
      - name: Install dependencies
        run: flutter pub get
      - name: Publish - dry run
        run: dart pub publish --dry-run
      - name: Publish to pub.dev
        run: dart pub publish -f
